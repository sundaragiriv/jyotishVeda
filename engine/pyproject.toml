[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotish-engine"
version = "0.1.0"
description = "Vedic astrology calculation engine (Swiss Ephemeris, Parashari rules)"
requires-python = ">=3.10"
dependencies = ["pyswisseph>=2.10", "pydantic>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["astro_core*", "models*", "importers*", "vargas*", "panchang*", "dasha*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
